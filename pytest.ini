[pytest]
base_url = https://practicesoftwaretesting.com
markers =
    smoke: P0 smoke tests — run on every push
    regression: P1 regression tests — run nightly and on PR
    edge: P2 edge case tests — run on demand / weekly
    ui: Playwright browser tests
    api: API-only tests (no browser)
addopts = -v --tb=short --reruns 2 --reruns-delay 2
