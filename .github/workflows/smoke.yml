name: Smoke Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (P0)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Diagnose site reachability
        run: |
          echo "=== HTTP status ==="
          curl -s -o /dev/null -w "HTTP %{http_code}  final-url: %{url_effective}\n" \
            -L --max-time 20 "https://practicesoftwaretesting.com"
          echo ""
          echo "=== Response headers ==="
          curl -s -I -L --max-time 20 "https://practicesoftwaretesting.com" | head -30
          echo ""
          echo "=== First 60 lines of HTML ==="
          curl -s -L --max-time 20 "https://practicesoftwaretesting.com" | head -60
        continue-on-error: true

      - name: Run smoke tests
        run: |
          mkdir -p allure-results results screenshots
          pytest tests/smoke/ -m smoke \
            -v --tb=short \
            --alluredir=allure-results \
            --junit-xml=results/smoke.xml \
            -p no:rerunfailures

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_number }}
          path: results/smoke.xml
          retention-days: 30

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: results/smoke.xml
          check_name: Smoke Test Results
          fail_on_failure: true
